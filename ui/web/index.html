<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blaudio</title>
  <link rel="stylesheet" href="vendor/nouislider.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── Menu bar ─────────────────────────────────────────────── -->
  <nav id="menubar">
    <div class="menu-entry">
      <span>Options</span>
      <div class="menu-drop">
        <button class="menu-action" onclick="blaudio.openSettings()">Settings</button>
        <div class="menu-sep"></div>
        <button class="menu-action" onclick="blaudio.quit()">Quit</button>
      </div>
    </div>
    <div class="menu-entry">
      <span>Help</span>
      <div class="menu-drop">
        <button class="menu-action" onclick="blaudio.about()">About</button>
      </div>
    </div>
  </nav>

  <!-- ── Mixer ────────────────────────────────────────────────── -->
  <main id="mixer">

    <!-- Master slider -->
    <div id="master-panel">
      <span class="slider-label master-label">MASTER</span>
      <div class="slider-wrapper">
        <div class="vu-meter" id="master-vu">
          <div class="vu-bar"></div>
          <div class="vu-peak"></div>
        </div>
        <span class="vol-readout"></span>
        <div id="master-slider" class="vslider"></div>
      </div>
      <div class="slider-controls">
        <button id="master-mute-btn" class="icon-btn mute-btn"
                title="Mute" onclick="blaudio.toggleMasterMute()">🔇</button>
      </div>
    </div>

    <div class="panel-divider"></div>

    <!-- Dynamic sliders -->
    <section id="sliders-section">
      <div id="sliders-scroll">
        <div id="sliders-container">
          <!-- populated by app.js -->
        </div>
      </div>
    </section>

  </main>

  <!-- ── Toolbar ──────────────────────────────────────────────── -->
  <footer id="toolbar">
    <button class="btn-flat" onclick="blaudio.openMixer()">Open Windows Mixer</button>
    <span class="spacer"></span>
    <button class="btn-accent" onclick="blaudio.openAddSliderDialog()">+ Add Slider</button>
  </footer>

</div>

<!-- ── Toast ────────────────────────────────────────────────── -->
<div id="toast"></div>

<!-- ── Add Slider dialog ─────────────────────────────────────── -->
<div id="overlay" class="hidden" onclick="blaudio.closeModal(event)">
  <div id="dialog">
    <h3 id="dialog-title">Add Slider</h3>

    <label>Name</label>
    <input id="slider-name" class="dialog-input" type="text" placeholder="e.g. Gaming">

    <label>Applications</label>
    <div id="app-list"></div>

    <label>Hardware knob</label>
    <div class="detect-row">
      <span id="knob-index-label" class="detect-label">None</span>
      <button type="button" class="btn-flat detect-btn" id="knob-detect-btn"
              onclick="blaudio._startKnobDetection()">Detect</button>
      <button type="button" class="btn-flat" id="knob-clear-btn"
              onclick="blaudio._clearKnobIndex()">Clear</button>
    </div>

    <label>Hardware mute button</label>
    <div class="detect-row">
      <span id="button-index-label" class="detect-label">None</span>
      <button type="button" class="btn-flat detect-btn" id="button-detect-btn"
              onclick="blaudio._startButtonDetection()">Detect</button>
      <button type="button" class="btn-flat" id="button-clear-btn"
              onclick="blaudio._clearButtonIndex()">Clear</button>
    </div>

    <div class="dialog-actions">
      <button class="btn-flat" onclick="blaudio.closeModal()">Cancel</button>
      <button id="dialog-confirm-btn" class="btn-accent" onclick="blaudio.confirmSlider()">Add</button>
    </div>
  </div>
</div>

<!-- ── Settings panel ─────────────────────────────────────────── -->
<div id="settings-overlay" class="hidden" onclick="blaudio.closeSettings(event)">
  <div id="settings-dialog">
    <h3>Settings</h3>

    <label>Theme</label>
    <div id="theme-picker"><!-- populated by app.js --></div>

    <label>Slider layout</label>
    <div id="layout-picker">
      <button class="layout-opt" data-layout="vertical" onclick="blaudio.setLayout('vertical')">
        <span class="layout-preview layout-preview-v"><i></i><i></i><i></i></span>
        Vertical
      </button>
      <button class="layout-opt" data-layout="horizontal" onclick="blaudio.showToast('Horizontal layout coming soon')">
        <span class="layout-preview layout-preview-h"><i></i><i></i><i></i></span>
        Horizontal
      </button>
    </div>

    <label>Device</label>
    <div id="port-detect-section"><!-- populated by settings.js --></div>

    <div class="dialog-actions">
      <button class="btn-accent" onclick="blaudio.closeSettings()">Done</button>
    </div>
  </div>
</div>

<!-- Load order matters: state must be defined before modules extend it. -->
<script src="vendor/nouislider.min.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api_bridge.js"></script>
<script src="js/vu_meter.js"></script>
<script src="js/master_slider.js"></script>
<script src="js/sliders.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/settings.js"></script>
<script src="app.js"></script>
</body>
</html>
