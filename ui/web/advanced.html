<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Popup-window layout overrides ─────────────────────────────── */
    body { margin: 0; overflow: hidden; }

    #settings-overlay {
      position: static !important;
      background: none !important;
      width: 100%;
      align-items: flex-start !important;
      justify-content: flex-start !important;
    }
    #settings-overlay.hidden { display: none !important; }

    #settings-dialog {
      width: 100% !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      border-left: none !important;
      border-right: none !important;
      border-top: none !important;
      border-bottom: none !important;
      box-sizing: border-box;
    }

    /* ── Advanced settings rows ─────────────────────────────────────── */
    .adv-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
    }

    .adv-info {
      flex: 1;
      min-width: 0;
    }

    .adv-label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    .adv-tip {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.35;
    }

    .adv-input {
      width: 72px !important;
      text-align: right;
      flex-shrink: 0;
      padding: 6px 8px !important;
    }

    .adv-reset {
      flex-shrink: 0;
      font-size: 1rem;
      padding: 4px 8px !important;
    }
  </style>
</head>
<body>

<div id="settings-overlay" class="hidden">
  <div id="settings-dialog">
    <h3>Advanced Settings</h3>

    <div id="advanced-section"><!-- populated by popup_advanced.js --></div>

    <div class="dialog-actions">
      <button class="btn-accent" onclick="blaudio.closeAdvancedSettings()">Done</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api_bridge.js"></script>
<script src="js/popup_advanced.js"></script>
</body>
</html>
